name: Local hearing
on:
  push:
    branches: [main, 'work/anna-senses-*']
    paths:
      - 'packages/senses/hearing*'
      - apps/desktop/src/local-hearing.ts
      - apps/desktop/src/hearing.worker.ts
      - apps/desktop/src/components/capture-panel.vue
      - apps/desktop/src/components/senses-sheet.vue
      - apps/desktop/core.ts
      - apps/desktop/main.ts
      - apps/desktop/preload.ts
      - packages/senses/model-store.ts
      - packages/senses/contracts.ts
      - tests/desktop-launch.mjs
      - package.json
      - pnpm-lock.yaml
      - vite.config.ts
      - scripts/prepare-hearing-fixture.mjs
      - tests/accept-local-hearing.mjs
      - .github/workflows/local-hearing.yml
  pull_request:
    paths:
      - 'packages/senses/hearing*'
      - apps/desktop/src/local-hearing.ts
      - apps/desktop/src/hearing.worker.ts
      - apps/desktop/src/components/capture-panel.vue
      - apps/desktop/src/components/senses-sheet.vue
      - apps/desktop/core.ts
      - apps/desktop/main.ts
      - apps/desktop/preload.ts
      - packages/senses/model-store.ts
      - packages/senses/contracts.ts
      - tests/desktop-launch.mjs
      - package.json
      - pnpm-lock.yaml
      - vite.config.ts
      - scripts/prepare-hearing-fixture.mjs
      - tests/accept-local-hearing.mjs
      - .github/workflows/local-hearing.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-hearing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hearing:
    name: Real model (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ANNA_HEARING_MODEL_DIR: .data/hearing-fixture/pack
      ANNA_HEARING_AUDIO: .data/hearing-fixture/raw/sherpa-onnx-streaming-paraformer-bilingual-zh-en/test_wavs/0.wav
      ANNA_HEARING_EXPECT: '昨天|monday|星期三'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Linux display and sandbox dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep xvfb bzip2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: hearing-paraformer-5462a1fc-v1
          path: |
            .data/hearing-fixture/pack
            .data/hearing-fixture/raw/sherpa-onnx-streaming-paraformer-bilingual-zh-en/test_wavs/0.wav
      - name: Prepare the pinned public model and reference audio
        run: node scripts/prepare-hearing-fixture.mjs
      - run: pnpm build
      - name: Silent file and virtual microphone acceptance
        if: runner.os != 'Linux'
        run: node tests/accept-local-hearing.mjs
      - name: Silent file and virtual microphone acceptance (Linux display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/accept-local-hearing.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: local-hearing-${{ matrix.os }}
          path: artifacts/local-hearing-acceptance.json
