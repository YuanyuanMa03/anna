name: CI
# Run a stable candidate after local review/preflight, rather than on every push or PR update.
on:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Linux sandbox and display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep xvfb
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Download the Live2D character assets
        run: pnpm assets
      - run: pnpm build
      # Deterministic desktop acceptance with a scripted model: no API key, no network.
      - name: Scripted desktop acceptance
        if: runner.os != 'Linux'
        run: pnpm test:scripted
      - name: Scripted desktop acceptance (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:scripted
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: acceptance-${{ matrix.os }}
          path: artifacts/
  # Ubuntu 24.04 restricts the user namespaces Chromium's sandbox needs: launch the packaged app the way users do.
  linux-package:
    name: Linux package (Chromium sandbox)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep xvfb
      - name: Download the Live2D character assets
        run: pnpm assets
      - run: pnpm package:linux
      - run: sysctl kernel.apparmor_restrict_unprivileged_userns
      - name: Packaged app without an AppArmor profile (launcher falls back to --no-sandbox)
        env:
          ANNA_PACKAGED_APP: ${{ github.workspace }}/dist/linux/Anna
          ANNA_EXPECT_SANDBOX: '0'
        run: xvfb-run -a pnpm test:scripted
      - name: Install with install.sh and the AppArmor profile
        env:
          ANNA_INSTALL_ALLOW_FILE: '1'
          ANNA_INSTALL_APPARMOR: '1'
        run: |
          RELEASE="$RUNNER_TEMP/release"
          mkdir -p "$RELEASE"
          ARCHIVE="$(ls "$PWD"/dist/linux/Anna-*-linux-x64.tar.gz)"
          SHA="$(sha256sum "$ARCHIVE" | cut -d' ' -f1)"
          printf '{\n  "version": "ci",\n  "assets": {\n    "linux-x64": { "url": "file://%s", "sha256": "%s" }\n  }\n}\n' "$ARCHIVE" "$SHA" > "$RELEASE/latest.json"
          ANNA_RELEASE_BASE="file://$RELEASE" bash website/public/install.sh
          sudo cat /etc/apparmor.d/anna-$(id -u)
      - name: Installed app with the AppArmor profile (Chromium sandbox on)
        env:
          ANNA_PACKAGED_APP: /home/runner/.local/share/anna-app
          ANNA_EXPECT_SANDBOX: '1'
        run: xvfb-run -a pnpm test:scripted
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: acceptance-linux-package
          path: artifacts/
